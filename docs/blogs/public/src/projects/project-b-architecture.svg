<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-label="Project B Multi-Agent Runtime 分层架构图" font-family="ui-sans-serif, system-ui, 'Microsoft YaHei', sans-serif">
  <title>Project B · Multi-Agent Runtime 系统架构</title>
  <defs>
    <linearGradient id="mainB" gradientUnits="userSpaceOnUse" x1="0" y1="64" x2="0" y2="600">
      <stop offset="0" stop-color="#c4b5fd"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4b5fd"/>
    </marker>
    <marker id="arrDimB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
