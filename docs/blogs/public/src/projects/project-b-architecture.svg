  <rect x="768" y="414" width="160" height="56" rx="8" fill="#1e293b" stroke="rgba(148,163,184,0.4)"/>
  <text x="848" y="438" text-anchor="middle" font-size="16" font-weight="600" fill="#f8fafc">HITL Approval</text>
  <text x="848" y="460" text-anchor="middle" font-size="15" fill="#94a3b8">人工审批 · resume</text>
  <rect x="948" y="414" width="176" height="56" rx="8" fill="#1e293b" stroke="rgba(148,163,184,0.4)"/>
