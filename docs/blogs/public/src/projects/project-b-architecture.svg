  <rect x="564" y="524" width="240" height="56" rx="8" fill="#1e293b" stroke="rgba(148,163,184,0.4)"/>
  <text x="684" y="548" text-anchor="middle" font-size="16" font-weight="600" fill="#f8fafc">Audit Trail</text>
  <text x="684" y="570" text-anchor="middle" font-size="15" fill="#94a3b8">任务 · 工具 · 审批证据</text>
  <text x="1116" y="546" text-anchor="end" font-size="15" fill="rgba(196,181,253,0.5)">默认 fake / offline 演示</text>
  <text x="1116" y="570" text-anchor="end" font-size="15" fill="rgba(196,181,253,0.5)">真实 provider 显式 opt-in</text>

