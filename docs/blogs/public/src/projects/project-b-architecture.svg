  <text x="364" y="108" text-anchor="middle" font-size="16" font-weight="600" fill="#f8fafc">Operator</text>
  <text x="364" y="130" text-anchor="middle" font-size="15" fill="#94a3b8">运营操作员</text>
  <rect x="516" y="84" width="324" height="56" rx="8" fill="#1e293b" stroke="rgba(148,163,184,0.4)"/>
  <text x="678" y="108" text-anchor="middle" font-size="16" font-weight="600" fill="#f8fafc">Next.js Operator Console</text>
  <text x="678" y="130" text-anchor="middle" font-size="15" fill="#94a3b8">Tasks · Approvals · Trace · Audit 页面</text>
