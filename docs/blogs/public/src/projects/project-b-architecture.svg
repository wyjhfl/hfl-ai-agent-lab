  <text x="1036" y="460" text-anchor="middle" font-size="15" fill="#94a3b8">工具协议骨架</text>

  <!-- L5 可观测与审计层 y=504 -->
  <rect x="36" y="504" width="1104" height="96" rx="10" fill="rgba(148,163,184,0.05)" stroke="rgba(148,163,184,0.35)"/>
  <rect x="36" y="504" width="196" height="96" rx="10" fill="rgba(196,181,253,0.07)"/>
